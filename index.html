<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Jay | Operational Hub Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2b1343 0%, #4B286D 60%, #1e293b 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #66CC00;
      color: #4B286D;
      font-weight: 900;
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(102, 204, 0, 0.4);
    }
    h1 { color: #4B286D; font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; }
    p.sub { color: #64748b; font-size: 0.82rem; margin-bottom: 22px; }
    .field { text-align: left; margin-bottom: 14px; }
    label { display: block; font-size: 0.75rem; font-weight: 700; color: #4B286D; margin-bottom: 5px; text-transform: uppercase; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4B286D; }
    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 999px;
      background: #4B286D;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-login:hover { background: #371c52; }
    .btn-login:active { transform: scale(0.99); }
    .status-msg {
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }
    .status-msg.ok { display: block; background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    .status-msg.err { display: block; background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; }
    .footer-note { margin-top: 18px; font-size: 0.72rem; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-badge">TJ</div>
    <h1>Team Jay | Operational Hub</h1>
    <p class="sub">Sign in with your corporate credentials to access the floor</p>

    <form onsubmit="handleDemoLogin(event)">
      <div class="field">
        <label>Corporate Email</label>
        <input type="email" id="emailInput" placeholder="name@telusinternational.com" required />
      </div>
      <div class="field">
        <label>Workspace Passcode</label>
        <input type="password" id="passInput" placeholder="Enter passcode (try: 1234)" required />
      </div>
      <button type="submit" class="btn-login">🔓 Sign In to Hub</button>
    </form>

    <div id="statusBox" class="status-msg"></div>
    <div class="footer-note">Hosted Free on GitHub Pages • Standalone Web Preview</div>
  </div>

  <script>
    function handleDemoLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();
      const box = document.getElementById('statusBox');

      if (pass === '1234') {
        box.className = 'status-msg ok';
        box.innerHTML = '✅ Welcome, <strong>' + email + '</strong>!<br>Next step: connect this UI to Supabase or your Google Sheet API.';
      } else {
        box.className = 'status-msg err';
        box.textContent = '❌ Invalid passcode. (Hint: enter 1234 for this live UI demo)';
      }
    }
  </script>

</body>
</html>
